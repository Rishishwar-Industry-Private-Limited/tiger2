<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tiger V2 Dual Portal Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#38fa38",
                        "police-green": "#38fa38",
                        "company-blue": "#00a3ff",
                        "emergency-orange": "#ff4d00",
                        "background-light": "#f5f8f5",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                },
            },
        }
    </script>
<style>
        .glass-container { background: rgba(15,23,15,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(56,250,56,0.12); }
        .grid-bg { background-image: linear-gradient(to right, rgba(56,250,56,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(56,250,56,0.03) 1px, transparent 1px); background-size: 50px 50px; }
    </style>
</head>
<body class="bg-background-dark font-display text-white selection:bg-primary/30 min-h-screen flex flex-col items-center justify-center overflow-x-hidden relative">
<div class="fixed inset-0 grid-bg z-0"></div>
<main class="relative z-10 w-full max-w-[600px] p-6">
    <div class="glass-container rounded-xl p-6">
        <h2 class="text-2xl font-bold text-white mb-4">Tiger V2 Login</h2>
        <p class="text-white/60 text-sm mb-6">Enter your credentials to access the Dual Portal (no sign up available)</p>
        <div class="space-y-4">
            <input id="username" class="w-full p-3 rounded bg-black/40 border border-white/10" placeholder="Username" />
            <input id="password" type="password" class="w-full p-3 rounded bg-black/40 border border-white/10" placeholder="Password" />
            <div class="flex gap-2">
                <button id="btn-login" class="bg-primary px-4 py-2 rounded font-bold text-black">Sign In</button>
                <button id="btn-cancel" class="bg-white/5 px-4 py-2 rounded">Cancel</button>
                <button id="btn-bypass" class="hidden bg-red-600 hover:bg-red-700 px-4 py-2 rounded font-bold text-white">Bypass Login (Dev)</button>
            </div>
        </div>
        <p id="login-msg" class="text-sm text-emergency-orange mt-4"></p>
        <p id="bypass-note" class="text-xs text-white/60 mt-2 hidden">Dev bypass enabled for <strong>localhost</strong> only. Use responsibly.</p>
    </div>
</main>
<script>
function setToken(t){ if (t) localStorage.setItem('tiger_token', t); else localStorage.removeItem('tiger_token'); }

document.getElementById('btn-login').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    document.getElementById('login-msg').innerText = '';
    if (!username || !password) { document.getElementById('login-msg').innerText = 'Both fields required'; return; }
    try {
        const res = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ username, password }) });
        if (!res.ok) {
            const j = await res.json().catch(()=>({}));
            document.getElementById('login-msg').innerText = j.error || 'Login failed';
            return;
        }
        const { token } = await res.json();
        setToken(token);
        window.location.href = '/';
    } catch (e) { document.getElementById('login-msg').innerText = 'Network error'; }
});

document.getElementById('btn-cancel').addEventListener('click', () => { document.getElementById('username').value=''; document.getElementById('password').value=''; });

// --- Dev bypass helper (local only) ---
// DEV_BYPASS_TOKEN removed for security. Use the server to create a token via /auth/create or set a dev token in the environment for local testing.
const DEV_BYPASS_TOKEN = '';
function isLocalHost() {
    try { const h = window.location.hostname; return h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h === '::1'; } catch(e){return false}
}
if (isLocalHost()) {
    document.getElementById('btn-bypass').classList.remove('hidden');
    document.getElementById('bypass-note').classList.remove('hidden');
}

const bypassBtn = document.getElementById('btn-bypass');
if (bypassBtn) {
    bypassBtn.addEventListener('click', async () => {
        // Try server-side dev-token endpoint first (opt-in DEV_BYPASS)
        try {
            const res = await fetch('/auth/dev-token?username=Kingraj2101');
            if (res.ok) {
                const j = await res.json();
                localStorage.setItem('tiger_token', j.token);
                bypassBtn.innerText = 'Bypassed ✓';
                setTimeout(() => window.location.href = '/', 500);
                return;
            }
        } catch (e) {
            console.warn('dev-token endpoint not available', e);
        }
        // Fallback to static token
        localStorage.setItem('tiger_token', DEV_BYPASS_TOKEN);
        bypassBtn.innerText = 'Bypassed ✓';
        setTimeout(() => window.location.href = '/', 500);
    });
}

</script>
</body>
</html>
